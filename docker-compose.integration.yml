services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: domestic_violence_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d domestic_violence_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: test-access-key
      MINIO_ROOT_PASSWORD: test-secret-key
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      sh -c "
        until mc alias set local http://minio:9000 test-access-key test-secret-key; do
          echo 'Waiting for MinIO...';
          sleep 2;
        done;
        mc mb local/evidence-test --ignore-existing;
      "

  vault:
    image: ghcr.io/openbao/openbao:latest
    cap_add:
      - IPC_LOCK
    environment:
      OPENBAO_DEV_ROOT_TOKEN_ID: test-token
      OPENBAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev -dev-root-token-id=test-token
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 20

  vault-init:
    image: ghcr.io/openbao/openbao:latest
    depends_on:
      vault:
        condition: service_healthy
    environment:
      BAO_ADDR: http://vault:8200
      BAO_TOKEN: test-token
    entrypoint: >
      sh -c "
        bao secrets enable -path=evidence kv-v2 || true;
        exit 0
      "
