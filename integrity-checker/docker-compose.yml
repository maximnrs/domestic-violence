version: "3.9"

# Copy .env.example to .env and adjust values before running in production.
# For a quick local start the defaults work as-is.

services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evidence_user
      POSTGRES_PASSWORD: evidence_pass
      POSTGRES_DB: evidence_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidence_user -d evidence_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  openbao:
    build:
      context: ./docker/openbao
    container_name: openbao
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      # This token is created automatically on first run.
      # Change it here and in api/integrity_checker if you prefer a different value.
      OPENBAO_TOKEN: evidence-service-token
    volumes:
      - openbao_data:/openbao/data
    ports:
      - "8200:8200"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
    container_name: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://evidence_user:evidence_pass@postgres:5432/evidence_db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_password
      MINIO_BUCKET: evidence
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: evidence-service-token
      HMAC_SECRET_PATH: secret/hmac_key
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      openbao:
        condition: service_healthy
    networks:
      - internal

  integrity_checker:
    build:
      context: ./integrity_checker
    container_name: integrity_checker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://evidence_user:evidence_pass@postgres:5432/evidence_db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_password
      MINIO_BUCKET: evidence
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: evidence-service-token
      HMAC_SECRET_PATH: secret/hmac_key
      CHECK_INTERVAL_SECONDS: 60
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      openbao:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:
  minio_data:
  openbao_data:

networks:
  internal:
    driver: bridge
