version: "3.9"

# All credentials and addresses live in .env — no extra flags needed.
# PostgreSQL, MinIO, and Vault run externally (see .env for IPs).

services:

  api:
    build:
      context: ./api
    container_name: integrity_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      VAULT_URL: ${VAULT_URL}
      VAULT_TOKEN: ${VAULT_TOKEN}
      VAULT_SKIP_VERIFY: ${VAULT_SKIP_VERIFY:-false}
      HMAC_SECRET_PATH: ${HMAC_SECRET_PATH}
    ports:
      - "8000:8000"
    networks:
      - integrity

  integrity_checker:
    build:
      context: ./integrity_checker
    container_name: integrity_checker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      VAULT_URL: ${VAULT_URL}
      VAULT_TOKEN: ${VAULT_TOKEN}
      VAULT_SKIP_VERIFY: ${VAULT_SKIP_VERIFY:-false}
      HMAC_SECRET_PATH: ${HMAC_SECRET_PATH}
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-60}
    networks:
      - integrity

networks:
  integrity:
    driver: bridge
